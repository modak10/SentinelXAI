# Baseline model configuration (Milestone 3).
#
# Per the Project Lead's approved HPO strategy: these three baselines get
# sensible/lightweight-tuned defaults, NOT full Optuna search -- that
# effort is reserved entirely for LightGBM in Milestone 4 (its own
# configs/model.yaml, created then). Nothing here is hardcoded in code.

logistic_regression:
  max_iter: 200
  C: 1.0
  solver: lbfgs
  class_weight: balanced

random_forest:
  n_estimators: 200
  max_depth: 20
  min_samples_leaf: 2
  n_jobs: -1
  class_weight: balanced_subsample

xgboost:
  n_estimators: 200
  max_depth: 8
  learning_rate: 0.1
  tree_method: hist
  n_jobs: -1

# Logistic Regression-only preprocessing. Tree models (Random Forest,
# XGBoost, and later LightGBM) use the Milestone 2 engineered features
# as-is -- no scaling, no log transform, raw Destination Port -- per the
# Milestone 2 Feature Engineering Plan's "Scaling requirement per model"
# table. All three settings below are fit-free (fixed thresholds/lists),
# so applying them independently to train/val/test introduces no leakage.
linear_model_preprocessing:
  # Destination Port is high-cardinality (49,730 distinct train values)
  # and nominal, not ordinal -- a raw integer would impose a false linear
  # order for a linear model. Bucketed into IANA-standard ranges instead.
  destination_port_buckets:
    - name: port_well_known
      max_port: 1023
    - name: port_registered
      min_port: 1024
      max_port: 49151
    - name: port_dynamic
      min_port: 49152
  # Explicit indicator dummies for ports tied to specific attack classes
  # in this dataset (FTP-Patator->21, SSH-Patator->22, Web
  # Attacks/DoS family->80, Heartbleed(TLS)->443, common RDP target->3389).
  destination_port_indicator_ports: [21, 22, 80, 443, 3389]
  # All 47 EDA "keep" features + the 12 clipped features are heavily
  # right-skewed (skew 2-245, see reports/eda_feature_stats.csv). log1p is
  # monotonic and safe on all of them post-clipping (every value >= 0), so
  # it's applied uniformly rather than maintaining a hand-picked skew list.
  log1p_all_features: true
