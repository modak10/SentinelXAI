# LightGBM configuration (Milestone 4 — the project's final model).
#
# Only FIXED settings live here (not tuned by Optuna). The tuned
# hyperparameters (learning_rate, num_leaves, ...) are Optuna's output —
# see reports/lightgbm/optuna_best_params.json, generated by
# scripts/tune_lightgbm.py, never hand-edited here. This split keeps
# human-authored config separate from generated tuning output, matching
# this project's established configs/ vs reports/ convention.

objective: multiclass
n_jobs: -1
verbosity: -1
