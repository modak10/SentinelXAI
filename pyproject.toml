[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelxai"
version = "0.1.0"
description = "Explainable AI Decision Intelligence Platform for Network Intrusion Detection"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that run against the full raw dataset (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
